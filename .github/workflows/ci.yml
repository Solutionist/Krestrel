name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: krestrel
          POSTGRES_PASSWORD: krestrel
          POSTGRES_DB: krestrel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U krestrel -d krestrel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway CI database; the same defaults as .env.example.
      DATABASE_URL: postgres://krestrel:krestrel@localhost:5432/krestrel
      MARKET_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
