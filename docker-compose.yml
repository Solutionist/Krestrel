# Local only: every published port binds to 127.0.0.1 (ADR 0007, personal-use data licence).
#   Database only (host dev):  bun run db:up
#   Full stack:                docker compose up -d --build --wait   → http://127.0.0.1:3000

name: krestrel

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krestrel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krestrel}
      POSTGRES_DB: ${POSTGRES_DB:-krestrel}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18+ image: mount the parent dir; PGDATA is /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

